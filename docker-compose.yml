networks:
  weather-subscriptions:
    name: weather-subscriptions

services:
  postgres:
    image: postgres:16.3-alpine
    ports:
      - '5432:5432'
    expose:
      - '5432'
    networks:
      weather-subscriptions:
        aliases:
          - postgres
    env_file:
      - deploy/docker/postgres/database.env
    healthcheck:
      test: pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}
      interval: 1s
      timeout: 1s
      retries: 20

  backend:
    build:
      context: ./
      dockerfile: ./deploy/docker/backend/Dockerfile
    ports:
      - '${PORT}:${PORT}'
    expose:
      - '${PORT}'
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      weather-subscriptions:
        aliases:
          - backend

  e2e-tests:
    build:
      context: ./
      dockerfile: ./deploy/docker/backend/Dockerfile
    env_file:
      - ./deploy/docker/backend/.e2e.env
    depends_on:
      postgres:
        condition: service_healthy
    command: go test ./test/e2e/...