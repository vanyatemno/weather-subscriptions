basePath: /
definitions:
  handlers.ErrorResponse:
    properties:
      error:
        example: city name is required
        type: string
    type: object
  handlers.SubscribeResponse:
    properties:
      message:
        example: confirmation email sent
        type: string
    type: object
  handlers.WeatherResponse:
    properties:
      description:
        example: partly cloudy
        type: string
      humidity:
        example: 64
        type: number
      temperature:
        example: 21.5
        type: number
    type: object
  subscriptions.SubscribeRequest:
    properties:
      city:
        type: string
      email:
        type: string
      frequency:
        type: string
    required:
    - city
    - email
    - frequency
    type: object
host: localhost:3000
info:
  contact: {}
  description: API for managing weather subscriptions and fetching weather data.
  title: Weather Subscriptions API
  version: "1.0"
paths:
  /confirm/{token}:
    get:
      description: Confirms a subscription using the token sent in the confirmation
        email.
      parameters:
      - description: Confirmation token
        in: path
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Confirm email subscription
      tags:
      - subscriptions
  /subscribe:
    post:
      consumes:
      - application/json
      description: Subscribe an email to receive weather updates for a specific city
        and frequency.
      parameters:
      - description: Subscription request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/subscriptions.SubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SubscribeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Subscribe to weather updates
      tags:
      - subscriptions
  /unsubscribe/{token}:
    get:
      description: Unsubscribes an email from weather updates using the token sent
        in emails.
      parameters:
      - description: Unsubscribe token
        in: path
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Unsubscribe from weather updates
      tags:
      - subscriptions
  /weather:
    get:
      description: Returns the current weather forecast for the specified city.
      parameters:
      - description: City name
        in: query
        name: city
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WeatherResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get current weather for a city
      tags:
      - weather
schemes:
- http
swagger: "2.0"
